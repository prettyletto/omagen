name: Verify bundled backend

on:
  push:
  pull_request:
    paths:
      - ".github/workflows/verify-bundled-backend.yml"
      - "backend/**"
      - "bin/omagen"
      - "bin/omagen-studio"
      - "install.sh"
      - "uninstall.sh"
      - "dev-install.sh"
      - "manifest.json"
      - "bar-manifest.json"
      - "Omagen.qml"
      - "OmagenBarWidget.qml"
      - "OmagenBar.qml"
      - "BarSurface.qml"
      - "NativeBarClone.qml"
      - "WorkspacePresentation.qml"
      - "BarModel.js"
      - "bar/**"
      - "qml/**"
      - "scripts/build-backend.sh"
      - "scripts/verify-bundled-backend.sh"
      - "scripts/v1-check.sh"
      - "bin/studio-theme-set"
      - "backend/go.mod"
      - "backend/go.sum"

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up the pinned Go toolchain
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Verify the bundled package
        run: GOCACHE=/tmp/omagen-gocache ./scripts/v1-check.sh

      - name: Record build provenance
        run: |
          go version
          git rev-parse HEAD
          sha256sum bin/omagen
          go version -m bin/omagen

      - name: Attest the verified package executable
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: bin/omagen
