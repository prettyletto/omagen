name: Verify bundled backend

on:
  push:
    branches:
      - dev
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up the pinned Go toolchain
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Verify the bundled package
        run: GOCACHE=/tmp/omagen-gocache ./scripts/v1-check.sh

      - name: Enforce stable promotion source
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        env:
          SOURCE_BRANCH: ${{ github.head_ref }}
        run: |
          test "$SOURCE_BRANCH" = dev || {
            echo "Stable main promotions must originate from dev (got $SOURCE_BRANCH)." >&2
            exit 1
          }

      - name: Record build provenance
        run: |
          mkdir -p artifacts
          go version
          git rev-parse HEAD
          sha256sum bin/omagen
          sha256sum bin/omagen-studio
          go version -m bin/omagen
          python3 scripts/verify-shader-provenance.py
          cp docs/shader-provenance.json artifacts/shader-provenance.json
          {
            echo "commit=$(git rev-parse HEAD)"
            go version
            sha256sum bin/omagen bin/omagen-studio
          } > artifacts/build-provenance.txt

      - name: Upload build and shader provenance
        uses: actions/upload-artifact@v4
        with:
          name: build-provenance-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error

      - name: Attest the verified package executable
        if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: bin/omagen

  marketplace-preflight:
    name: Marketplace preflight
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out the exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Run deterministic static preflight
        run: |
          mkdir -p artifacts
          python3 scripts/test-marketplace-preflight.py
          python3 scripts/marketplace-preflight.py \
            --commit "$(git rev-parse HEAD)" \
            ${{ github.event.pull_request.base.sha && format('--compare-to {0}', github.event.pull_request.base.sha) || '' }} \
            --report artifacts/marketplace-preflight.json

      - name: Upload commit-bound security evidence
        uses: actions/upload-artifact@v4
        with:
          name: marketplace-preflight-${{ github.sha }}
          path: artifacts/marketplace-preflight.json
          if-no-files-found: error
